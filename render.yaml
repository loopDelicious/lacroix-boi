services:
  - type: web
    name: lacroix
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: node scripts/setup-db.mjs
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lacroix-db
          property: connectionString

databases:
  - name: lacroix-db
    databaseName: lacroix
    plan: basic-256mb
